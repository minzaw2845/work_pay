<!-- Script Logic -->
    <script>
        let selectedYear = 2026;
        let selectedMonthIndex = 6; 
        let workLogs = {};
        let savedSlips = [];
        let userProfile = { name: '', contact: '' };
        let activeSelectedDateStr = '';

        // App မစမီ Storage ထဲမှ ဒေတာများ လာရောက်ဖတ်ယူခြင်း
        try {
            workLogs = JSON.parse(localStorage.getItem('workpay_logs') || '{}');
            savedSlips = JSON.parse(localStorage.getItem('workpay_slips') || '[]');
            userProfile = JSON.parse(localStorage.getItem('workpay_user') || '{"name":"","contact":""}');
            
            // သိမ်းထားသော လ နှင့် နှစ် အား ဖတ်ယူခြင်း
            const savedYear = localStorage.getItem('workpay_selectedYear');
            const savedMonth = localStorage.getItem('workpay_selectedMonth');
            if (savedYear !== null) selectedYear = parseInt(savedYear);
            if (savedMonth !== null) selectedMonthIndex = parseInt(savedMonth);
        } catch(e) {}

        const monthsNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        function initApp() {
            loadSavedInputs(); // သိမ်းထားသော Rates/Bonuses များကို ပြန်ဖြည့်ခြင်း
            updateUserUI();
            renderCalendar();
            calculateSalary();
            renderSavedSlips();
        }

        // Direct Execution to prevent missing load event
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        // Rates များနှင့် အခြား ရ/နုတ် ငွေများကို စက်ထဲသိမ်းဆည်းခြင်း
        function saveInputsToStorage() {
            const inputs = {
                dailyRate: document.getElementById('dailyRateInput')?.value || '',
                allowance: document.getElementById('allowanceInput')?.value || '',
                otRate: document.getElementById('otRateInput')?.value || '',
                foodRate: document.getElementById('foodRateInput')?.value || '',
                otherBonus: document.getElementById('otherBonusInput')?.value || '',
                otherDeduct: document.getElementById('otherDeductInput')?.value || ''
            };
            localStorage.setItem('workpay_inputs', JSON.stringify(inputs));
        }

        // စက်ထဲသိမ်းထားသော တန်ဖိုးများကို Input များထဲသို့ ပြန်လည်ဖြည့်သွင်းခြင်း
        function loadSavedInputs() {
            try {
                const saved = JSON.parse(localStorage.getItem('workpay_inputs') || '{}');
                if (saved.dailyRate !== undefined) document.getElementById('dailyRateInput').value = saved.dailyRate;
                if (saved.allowance !== undefined) document.getElementById('allowanceInput').value = saved.allowance;
                if (saved.otRate !== undefined) document.getElementById('otRateInput').value = saved.otRate;
                if (saved.foodRate !== undefined) document.getElementById('foodRateInput').value = saved.foodRate;
                if (saved.otherBonus !== undefined) document.getElementById('otherBonusInput').value = saved.otherBonus;
                if (saved.otherDeduct !== undefined) document.getElementById('otherDeductInput').value = saved.otherDeduct;
            } catch(e) {}
        }

        // Share Handlers
        const shareTextContent = "WorkPay App - အလုပ်ချိန်နှင့် လစာတွက်ချက်ပေးသော ဆော့ဖ်ဝဲလ်";

        function shareApp() {
            if (navigator.share && window.location.protocol.startsWith('http')) {
                navigator.share({
                    title: 'WorkPay',
                    text: shareTextContent,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                document.getElementById('shareModal').classList.remove('hidden');
            }
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
        }

        function shareToWhatsApp() {
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareTextContent)}`;
            window.open(url, '_blank');
            closeShareModal();
        }

        function copyAppMessage() {
            navigator.clipboard.writeText(shareTextContent).then(() => {
                alert('စာသားကို စက်ထဲ Copy ကူးယူပြီးပါပြီ။');
                closeShareModal();
            }).catch(() => {
                alert(shareTextContent);
            });
        }

        // User Profile Functions
        function openProfileModal() {
            document.getElementById('inputUserName').value = userProfile.name || '';
            document.getElementById('inputUserContact').value = userProfile.contact || '';
            document.getElementById('profileModal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        function saveUserProfile() {
            const name = document.getElementById('inputUserName').value.trim();
            const contact = document.getElementById('inputUserContact').value.trim();

            if (!name) {
                alert('အသုံးပြုသူ နာမည် ထည့်ပေးပါ။');
                return;
            }

            userProfile = { name, contact };
            localStorage.setItem('workpay_user', JSON.stringify(userProfile));
            updateUserUI();
            closeProfileModal();
        }

        function updateUserUI() {
            const btnLabel = document.getElementById('headerUserName');
            if (btnLabel) {
                btnLabel.innerText = userProfile.name ? userProfile.name : 'Login';
            }
        }

        function changeMonth(delta) {
            selectedMonthIndex += delta;
            if (selectedMonthIndex > 11) {
                selectedMonthIndex = 0;
                selectedYear++;
            } else if (selectedMonthIndex < 0) {
                selectedMonthIndex = 11;
                selectedYear--;
            }

            // ရွေးချယ်လိုက်သော လ နှင့် နှစ် ကို စက်ထဲသိမ်းဆည်းခြင်း
            localStorage.setItem('workpay_selectedYear', selectedYear);
            localStorage.setItem('workpay_selectedMonth', selectedMonthIndex);

            renderCalendar();
            calculateSalary();
        }

        function getActiveDates() {
            const datesToDisplay = [];
            const startMonth = monthsNames[selectedMonthIndex];
            const nextMonthIndex = (selectedMonthIndex + 1) % 12;
            const endMonth = monthsNames[nextMonthIndex];
            const endYear = nextMonthIndex === 0 ? selectedYear + 1 : selectedYear;

            const titleElem = document.getElementById('monthDisplayTitle');
            if (titleElem) {
                titleElem.innerText = `${startMonth} 26 - ${endMonth} 25, ${selectedYear}`;
            }

            const daysInStartMonth = new Date(selectedYear, selectedMonthIndex + 1, 0).getDate();
            for (let d = 26; d <= daysInStartMonth; d++) {
                datesToDisplay.push(new Date(selectedYear, selectedMonthIndex, d));
            }
            for (let d = 1; d <= 25; d++) {
                datesToDisplay.push(new Date(endYear, nextMonthIndex, d));
            }

            return datesToDisplay;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const datesToDisplay = getActiveDates();

            if (datesToDisplay.length > 0) {
                const firstDayIndex = datesToDisplay[0].getDay();
                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'calendar-day bg-slate-50/50 border-r border-b border-slate-100';
                    grid.appendChild(emptyCell);
                }
            }

            datesToDisplay.forEach(dateObj => {
                const dayNum = dateObj.getDate();
                const isSun = dateObj.getDay() === 0;
                const yearStr = dateObj.getFullYear();
                const monthStr = String(dateObj.getMonth() + 1).padStart(2, '0');
                const dayStr = String(dayNum).padStart(2, '0');
                const dateKey = `${yearStr}-${monthStr}-${dayStr}`;

                const log = workLogs[dateKey] || { daily: 0, ot: 0 };

                const cell = document.createElement('div');
                cell.className = `calendar-day border-r border-b border-slate-200 p-1 flex flex-col items-center justify-between cursor-pointer transition hover:bg-orange-50 active:bg-orange-100 ${isSun ? 'bg-red-50/40' : 'bg-white'}`;
                
                cell.onclick = function() {
                    openDayModal(dateKey);
                };

                let badgeHTML = '';
                if (log.daily > 0 || log.ot > 0) {
                    badgeHTML = `
                        <div class="text-[9px] leading-tight font-bold text-center w-full">
                            ${log.daily > 0 ? `<span class="text-blue-600 block">D:${log.daily}</span>` : ''}
                            ${log.ot > 0 ? `<span class="text-orange-600 block">OT:${log.ot}</span>` : ''}
                        </div>
                    `;
                }

                cell.innerHTML = `
                    <span class="text-xs font-bold ${isSun ? 'text-red-500' : 'text-slate-800'}">${dayNum}</span>
                    ${badgeHTML}
                `;
                grid.appendChild(cell);
            });
        }

        function calculateSalary() {
            // စာရိုက်လိုက်တိုင်း စက်ထဲသို့ တပြိုင်နက်သိမ်းဆည်းခြင်း
            saveInputsToStorage();

            const dailyRate = parseFloat(document.getElementById('dailyRateInput')?.value) || 0;
            const allowanceRate = parseFloat(document.getElementById('allowanceInput')?.value) || 0;
            const otRate = parseFloat(document.getElementById('otRateInput')?.value) || 0;
            const foodRate = parseFloat(document.getElementById('foodRateInput')?.value) || 0;

            const otherBonus = parseFloat(document.getElementById('otherBonusInput')?.value) || 0;
            const otherDeduct = parseFloat(document.getElementById('otherDeductInput')?.value) || 0;

            let totalDailyCount = 0;
            let totalOTCount = 0;

            const activeDates = getActiveDates();
            activeDates.forEach(dateObj => {
                const yearStr = dateObj.getFullYear();
                const monthStr = String(dateObj.getMonth() + 1).padStart(2, '0');
                const dayStr = String(dateObj.getDate()).padStart(2, '0');
                const k = `${yearStr}-${monthStr}-${dayStr}`;
                
                if (workLogs[k]) {
                    totalDailyCount += parseFloat(workLogs[k].daily || 0);
                    totalOTCount += parseFloat(workLogs[k].ot || 0);
                }
            });

            if (document.getElementById('dailyDaysCount')) document.getElementById('dailyDaysCount').innerText = totalDailyCount;
            if (document.getElementById('otHoursCount')) document.getElementById('otHoursCount').innerText = totalOTCount;
            if (document.getElementById('workedDaysCount')) document.getElementById('workedDaysCount').innerText = totalDailyCount;

            const dailyTotal = totalDailyCount * dailyRate;
            const allowanceTotal = totalDailyCount * allowanceRate;
            const otTotal = totalOTCount * otRate;

            const subtotal = dailyTotal + allowanceTotal + otTotal + otherBonus;
            const socialSec = subtotal * 0.04;
            const foodTotal = totalDailyCount > 0 ? (totalDailyCount * foodRate) : 0;
            
            const netTotal = subtotal - socialSec - foodTotal - otherDeduct;

            if (document.getElementById('valDailySum')) document.getElementById('valDailySum').innerText = dailyTotal.toFixed(1);
            if (document.getElementById('valAllowanceSum')) document.getElementById('valAllowanceSum').innerText = allowanceTotal.toFixed(1);
            if (document.getElementById('valOTSum')) document.getElementById('valOTSum').innerText = otTotal.toFixed(1);
            if (document.getElementById('valOtherBonusSum')) document.getElementById('valOtherBonusSum').innerText = otherBonus.toFixed(1);
            
            if (document.getElementById('valSubtotal')) document.getElementById('valSubtotal').innerText = subtotal.toFixed(1);
            if (document.getElementById('valSocialSec')) document.getElementById('valSocialSec').innerText = socialSec.toFixed(1);
            if (document.getElementById('valFoodSum')) document.getElementById('valFoodSum').innerText = foodTotal.toFixed(1);
            if (document.getElementById('valOtherDeductSum')) document.getElementById('valOtherDeductSum').innerText = otherDeduct.toFixed(1);

            if (document.getElementById('valTotalAmount')) document.getElementById('valTotalAmount').innerText = netTotal.toFixed(1);

            return { 
                totalDailyCount, 
                totalOTCount, 
                dailyTotal,
                allowanceTotal,
                otTotal,
                otherBonus,
                subtotal,
                socialSec,
                foodTotal,
                otherDeduct,
                netTotal 
            };
        }

        // Save Payslip Logic
        function savePayslip() {
            if (!userProfile.name) {
                alert('လစာစလစ် မသိမ်းမီ ပရိုဖိုင် (အသုံးပြုသူနာမည်) အရင်ဖြည့်သွင်းပေးပါခင်ဗျာ။');
                openProfileModal();
                return;
            }

            const title = document.getElementById('monthDisplayTitle')?.innerText || '';
            const sal = calculateSalary();

            const newSlip = {
                id: Date.now(),
                user: userProfile.name,
                contact: userProfile.contact,
                cycleTitle: title,
                dailyDays: sal.totalDailyCount,
                otHours: sal.totalOTCount,
                details: {
                    dailyTotal: sal.dailyTotal.toFixed(1),
                    allowanceTotal: sal.allowanceTotal.toFixed(1),
                    otTotal: sal.otTotal.toFixed(1),
                    otherBonus: sal.otherBonus.toFixed(1),
                    subtotal: sal.subtotal.toFixed(1),
                    socialSec: sal.socialSec.toFixed(1),
                    foodTotal: sal.foodTotal.toFixed(1),
                    otherDeduct: sal.otherDeduct.toFixed(1)
                },
                netTotal: sal.netTotal.toFixed(1),
                savedAt: new Date().toLocaleDateString()
            };

            savedSlips.unshift(newSlip);
            localStorage.setItem('workpay_slips', JSON.stringify(savedSlips));
            renderSavedSlips();
            alert(`[${title}] အတွက် လစာစလစ် သိမ်းဆည်းပြီးပါပြီ။`);
        }

        function renderSavedSlips() {
            const container = document.getElementById('savedPayslipsList');
            if (!container) return;

            if (savedSlips.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-[11px] text-center py-2">သိမ်းထားသော စလစ် မရှိသေးပါ။</p>`;
                return;
            }

            container.innerHTML = savedSlips.map(slip => `
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-bold text-slate-800 text-[11px]">${slip.cycleTitle}</div>
                        <div class="text-[10px] text-slate-500">အမည်: ${slip.user} (${slip.contact || 'No contact'})</div>
                        <div class="text-[10px] text-slate-500">ဆင်းရက်: ${slip.dailyDays} ရက် | OT: ${slip.otHours} နာရီ</div>
                    </div>
                    <div class="text-right flex flex-col items-end gap-1">
                        <div class="font-extrabold text-orange-600 text-sm">${slip.netTotal} BHD</div>
                        <div class="flex items-center gap-2">
                            <button onclick="downloadPDF(${slip.id})" class="text-[10px] bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded flex items-center gap-1 transition">
                                <i class="fa-solid fa-file-pdf"></i> PDF ထုတ်မည်
                            </button>
                            <button onclick="deleteSlip(${slip.id})" class="text-[10px] text-red-500 hover:underline">ဖျက်မည်</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // PDF Generation Function
        function downloadPDF(slipId) {
            const slip = savedSlips.find(s => s.id === slipId);
            if (!slip) return;

            document.getElementById('pdfCycleTitle').innerText = slip.cycleTitle;
            document.getElementById('pdfUserName').innerText = slip.user;
            document.getElementById('pdfUserContact').innerText = slip.contact || '-';
            document.getElementById('pdfNetTotal').innerText = slip.netTotal;

            const d = slip.details || {};
            const tableBody = document.getElementById('pdfTableBody');
            tableBody.innerHTML = `
                <tr><td style="padding: 6px; border: 1px solid #e2e8f0;">နေ့စဉ်ကြေး (Daily - ${slip.dailyDays} ရက်)</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right;">${d.dailyTotal || 0}</td></tr>
                <tr><td style="padding: 6px; border: 1px solid #e2e8f0;">သက်သာချောင်ချိရေး</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right;">${d.allowanceTotal || 0}</td></tr>
                <tr><td style="padding: 6px; border: 1px solid #e2e8f0;">OT (အချိန်ပိုကြေး - ${slip.otHours} နာရီ)</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right;">${d.otTotal || 0}</td></tr>
                <tr><td style="padding: 6px; border: 1px solid #e2e8f0;">အခြား ရရှိငွေ (ပေါင်းရန်)</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right; color: #16a34a;">+${d.otherBonus || 0}</td></tr>
                <tr style="font-weight: bold; background: #f8fafc;"><td style="padding: 6px; border: 1px solid #e2e8f0;">စုစုပေါင်း (TOTAL)</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right;">${d.subtotal || 0}</td></tr>
                <tr><td style="padding: 6px; border: 1px solid #e2e8f0; color: #dc2626;">လူမှုဖူလုံရေး (4%)</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right; color: #dc2626;">-${d.socialSec || 0}</td></tr>
                <tr><td style="padding: 6px; border: 1px solid #e2e8f0; color: #dc2626;">ကားခ</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right; color: #dc2626;">-${d.foodTotal || 0}</td></tr>
                <tr><td style="padding: 6px; border: 1px solid #e2e8f0; color: #dc2626;">အခြား ဖြတ်တောက်ငွေ (နုတ်ရန်)</td><td style="padding: 6px; border: 1px solid #e2e8f0; text-align: right; color: #dc2626;">-${d.otherDeduct || 0}</td></tr>
            `;

            const element = document.getElementById('pdfContent');
            const opt = {
                margin: 10,
                filename: `Payslip_${slip.user}_${slip.cycleTitle.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a5', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        function deleteSlip(id) {
            if (confirm('ဒီလစာစလစ်ကို ဖျက်ရန် သေချာပါသလား။')) {
                savedSlips = savedSlips.filter(s => s.id !== id);
                localStorage.setItem('workpay_slips', JSON.stringify(savedSlips));
                renderSavedSlips();
            }
        }

        function openDayModal(dateKey) {
            activeSelectedDateStr = dateKey;
            document.getElementById('modalDateTitle').innerText = dateKey;
            
            const existing = workLogs[dateKey] || { daily: '', ot: '' };
            document.getElementById('modalDailyHours').value = existing.daily || '';
            document.getElementById('modalOTHours').value = existing.ot || '';

            document.getElementById('dayModal').classList.remove('hidden');
        }

        function closeDayModal() {
            document.getElementById('dayModal').classList.add('hidden');
        }

        function saveDayEntry() {
            const dailyVal = parseFloat(document.getElementById('modalDailyHours').value) || 0;
            const otVal = parseFloat(document.getElementById('modalOTHours').value) || 0;

            if (dailyVal > 0 || otVal > 0) {
                workLogs[activeSelectedDateStr] = { daily: dailyVal, ot: otVal };
            } else {
                delete workLogs[activeSelectedDateStr];
            }

            try {
                localStorage.setItem('workpay_logs', JSON.stringify(workLogs));
            } catch(e) {}

            renderCalendar();
            calculateSalary();
            closeDayModal();
        }
    </script>
